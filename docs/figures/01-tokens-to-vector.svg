<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 430' width='880' height='430' role='img' aria-label='A sentence becomes one vector'><title>A sentence becomes one vector</title><rect width='880' height='430' fill='#fbfbfd'/><text x='24' y='30' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' fill='#1f2933' text-anchor='start' font-weight='600' font-style='normal'>1 · A sentence becomes one vector</text><text x='24' y='60' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='italic'>“TRPV1 mediates vasodilation in arterial smooth muscle.”</text><text x='24' y='92' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>split into word pieces the model knows</text><rect x='24' y='102' width='45.5' height='26' rx='5' fill='#e4ecf7' stroke='#d8dee9' stroke-width='1'/><text x='46.75' y='119' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#1f2933' text-anchor='middle' font-weight='normal' font-style='normal'>[CLS]</text><rect x='75.5' y='102' width='45.5' height='26' rx='5' fill='#eef2f7' stroke='#d8dee9' stroke-width='1'/><text x='98.25' y='119' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#1f2933' text-anchor='middle' font-weight='normal' font-style='normal'>trpv1</text><rect x='127.0' y='102' width='67.4' height='26' rx='5' fill='#eef2f7' stroke='#d8dee9' stroke-width='1'/><text x='160.7' y='119' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#1f2933' text-anchor='middle' font-weight='normal' font-style='normal'>mediates</text><rect x='200.4' y='102' width='96.6' height='26' rx='5' fill='#eef2f7' stroke='#d8dee9' stroke-width='1'/><text x='248.7' y='119' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#1f2933' text-anchor='middle' font-weight='normal' font-style='normal'>vasodilation</text><rect x='303.0' y='102' width='23.6' height='26' rx='5' fill='#eef2f7' stroke='#d8dee9' stroke-width='1'/><text x='314.8' y='119' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#1f2933' text-anchor='middle' font-weight='normal' font-style='normal'>in</text><rect x='332.6' y='102' width='67.4' height='26' rx='5' fill='#eef2f7' stroke='#d8dee9' stroke-width='1'/><text x='366.3' y='119' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#1f2933' text-anchor='middle' font-weight='normal' font-style='normal'>arterial</text><rect x='406.0' y='102' width='52.8' height='26' rx='5' fill='#eef2f7' stroke='#d8dee9' stroke-width='1'/><text x='432.4' y='119' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#1f2933' text-anchor='middle' font-weight='normal' font-style='normal'>smooth</text><rect x='464.8' y='102' width='52.8' height='26' rx='5' fill='#eef2f7' stroke='#d8dee9' stroke-width='1'/><text x='491.2' y='119' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#1f2933' text-anchor='middle' font-weight='normal' font-style='normal'>muscle</text><rect x='523.6' y='102' width='16.3' height='26' rx='5' fill='#eef2f7' stroke='#d8dee9' stroke-width='1'/><text x='531.75' y='119' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#1f2933' text-anchor='middle' font-weight='normal' font-style='normal'>.</text><rect x='545.9' y='102' width='45.5' height='26' rx='5' fill='#e4ecf7' stroke='#d8dee9' stroke-width='1'/><text x='568.65' y='119' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#1f2933' text-anchor='middle' font-weight='normal' font-style='normal'>[SEP]</text><text x='601.4' y='119' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>10 tokens</text><text x='24' y='162' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>each token becomes 768 numbers</text><text x='150' y='188' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#1f2933' text-anchor='end' font-weight='normal' font-style='normal'>[CLS]</text><rect x='162' y='174' width='300' height='20' rx='5' fill='#ffffff' stroke='#d8dee9' stroke-width='1'/><text x='172' y='188' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>-0.05  -0.48  +0.03  -0.34  -0.24</text><text x='470' y='188' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>…</text><text x='150' y='212' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#1f2933' text-anchor='end' font-weight='normal' font-style='normal'>trpv1</text><rect x='162' y='198' width='300' height='20' rx='5' fill='#ffffff' stroke='#d8dee9' stroke-width='1'/><text x='172' y='212' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>-0.02  -0.33  -0.18  -0.20  -0.23</text><text x='470' y='212' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>…</text><text x='150' y='236' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#1f2933' text-anchor='end' font-weight='normal' font-style='normal'>mediates</text><rect x='162' y='222' width='300' height='20' rx='5' fill='#ffffff' stroke='#d8dee9' stroke-width='1'/><text x='172' y='236' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>-0.01  +0.00  +0.10  -0.22  +0.10</text><text x='470' y='236' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>…</text><text x='150' y='260' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#1f2933' text-anchor='end' font-weight='normal' font-style='normal'>vasodilation</text><rect x='162' y='246' width='300' height='20' rx='5' fill='#ffffff' stroke='#d8dee9' stroke-width='1'/><text x='172' y='260' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>-0.09  -0.10  -0.09  -0.12  -0.17</text><text x='470' y='260' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>…</text><text x='150' y='284' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#1f2933' text-anchor='end' font-weight='normal' font-style='normal'>…</text><rect x='162' y='270' width='300' height='20' rx='5' fill='#ffffff' stroke='#d8dee9' stroke-width='1'/><text x='172' y='284' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>…</text><text x='470' y='284' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'></text><text x='150' y='308' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#1f2933' text-anchor='end' font-weight='normal' font-style='normal'>[SEP]</text><rect x='162' y='294' width='300' height='20' rx='5' fill='#ffffff' stroke='#d8dee9' stroke-width='1'/><text x='172' y='308' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>-0.07  -0.21  -0.05  -0.19  -0.11</text><text x='470' y='308' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>…</text><path d='M486 176 q10 0 10 12 v40 q0 12 10 12 q-10 0 -10 12 v40 q0 12 -10 12' fill='none' stroke='#d8dee9' stroke-width='1.5'/><text x='506' y='258' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2933' text-anchor='start' font-weight='600' font-style='normal'>average</text><text x='506' y='274' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>over the real tokens</text><line x1='586' y1='253' x2='619.0' y2='253.0' stroke='#6b7280' stroke-width='1.8'/><polygon points='626,253 619.6083774178138,255.85432317141698 619.6083774178138,250.14567682858302' fill='#6b7280'/><text x='636' y='200' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>one vector for the whole sentence</text><rect x='636' y='210' width='216' height='22' rx='5' fill='#ffffff' stroke='#d8dee9' stroke-width='1'/><text x='646' y='225' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#1f2933' text-anchor='start' font-weight='normal' font-style='normal'>-0.02  -0.10  -0.01  -0.16  …</text><text x='636' y='254' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>length 14.08</text><line x1='700' y1='262' x2='700.0' y2='281.0' stroke='#6b7280' stroke-width='1.8'/><polygon points='700,288 697.145676828583,281.60837741781387 702.854323171417,281.6083774178138' fill='#6b7280'/><text x='712' y='280' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#1f2933' text-anchor='start' font-weight='normal' font-style='normal'>scale to length 1</text><rect x='636' y='296' width='216' height='22' rx='5' fill='#e7f3ec' stroke='#b7dfc6' stroke-width='1'/><text x='646' y='311' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#1a7f37' text-anchor='start' font-weight='normal' font-style='normal'>-0.0011  -0.0069  -0.0010  …</text><text x='636' y='338' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#1a7f37' text-anchor='start' font-weight='normal' font-style='normal'>length 1.00 — only the direction is kept</text><line x1='24' y1='366' x2='856' y2='366' stroke='#d8dee9' stroke-width='1'/><text x='24' y='390' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2933' text-anchor='start' font-weight='normal' font-style='normal'>Every paper in the corpus goes through exactly this, so each one ends up as a single arrow of length 1.</text><text x='24' y='410' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>Papers about similar things end up pointing in similar directions — that is the whole basis of the relevance gate.</text></svg>
