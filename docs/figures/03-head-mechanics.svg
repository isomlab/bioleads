<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 520' width='880' height='520' role='img' aria-label='What one head computes'><title>What one head computes</title><rect width='880' height='520' fill='#fbfbfd'/><text x='24' y='30' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' fill='#1f2933' text-anchor='start' font-weight='600' font-style='normal'>3 · What one head actually computes</text><text x='24' y='56' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>Layer 1, head 8, asking on behalf of the word “muscle”. Every number here is from the model.</text><text x='24' y='92' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>The layer holds three 768×768 matrices. This head owns columns 512–575 of each — its 64-wide slice.</text><rect x='24' y='110' width='262' height='66' rx='5' fill='#ffffff' stroke='#d8dee9' stroke-width='1'/><text x='38' y='132' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f6feb' text-anchor='start' font-weight='600' font-style='normal'>query</text><text x='38' y='150' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>what “muscle” is looking for</text><text x='38' y='168' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#1f2933' text-anchor='start' font-weight='normal' font-style='normal'>768 numbers in → 64 out</text><rect x='306' y='110' width='262' height='66' rx='5' fill='#ffffff' stroke='#d8dee9' stroke-width='1'/><text x='320' y='132' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1a7f37' text-anchor='start' font-weight='600' font-style='normal'>key</text><text x='320' y='150' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>what each word offers</text><text x='320' y='168' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#1f2933' text-anchor='start' font-weight='normal' font-style='normal'>768 numbers in → 64 out</text><rect x='588' y='110' width='262' height='66' rx='5' fill='#ffffff' stroke='#d8dee9' stroke-width='1'/><text x='602' y='132' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#bf8700' text-anchor='start' font-weight='600' font-style='normal'>value</text><text x='602' y='150' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>what gets passed on</text><text x='602' y='168' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#1f2933' text-anchor='start' font-weight='normal' font-style='normal'>768 numbers in → 64 out</text><text x='24' y='208' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>Every word’s key is compared with that one query — a dot product, divided by √64 to keep the numbers in range:</text><text x='150' y='228' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>key of…</text><text x='300' y='228' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>q · k / √64</text><text x='470' y='228' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>after softmax</text><text x='150' y='250' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11.5' fill='#1a7f37' text-anchor='end' font-weight='normal' font-style='normal'>smooth</text><text x='300' y='250' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11.5' fill='#1f2933' text-anchor='end' font-weight='normal' font-style='normal'>23.95</text><text x='470' y='250' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11.5' fill='#1a7f37' text-anchor='end' font-weight='normal' font-style='normal'>0.9990</text><rect x='482' y='241' width='199.8' height='11' rx='2' fill='#1a7f37' opacity='0.7'/><text x='150' y='272' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11.5' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>muscle</text><text x='300' y='272' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11.5' fill='#1f2933' text-anchor='end' font-weight='normal' font-style='normal'>16.31</text><text x='470' y='272' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11.5' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>0.0005</text><rect x='482' y='263' width='1.5' height='11' rx='2' fill='#6b7280' opacity='0.7'/><text x='150' y='294' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11.5' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>arterial</text><text x='300' y='294' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11.5' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>…</text><text x='470' y='294' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11.5' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>…</text><text x='24' y='316' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>A gap of 7.6 in the raw scores becomes 0.999 against 0.0005 — softmax turns a preference into a near-decision.</text><rect x='24' y='340' width='832' height='74' rx='5' fill='#eef2f7' stroke='#d8dee9' stroke-width='1'/><text x='40' y='362' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2933' text-anchor='start' font-weight='600' font-style='normal'>The head’s answer for “muscle”</text><text x='40' y='382' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11.5' fill='#1f2933' text-anchor='start' font-weight='normal' font-style='normal'>= 0.999 × value(smooth)  +  0.0005 × value(muscle)  +  … → 64 numbers</text><text x='40' y='402' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>Almost literally: “for this round, become the word before me.”</text><line x1='24' y1='434' x2='856' y2='434' stroke='#d8dee9' stroke-width='1'/><text x='24' y='456' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2933' text-anchor='start' font-weight='normal' font-style='normal'>All twelve heads do this at once on their own 64-wide slices. Their outputs are laid end to end — 12 × 64 = 768 — and passed through a</text><text x='24' y='474' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>fourth matrix that mixes them back together. That combined result is what the token becomes, and the next layer starts again from it.</text><text x='24' y='502' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>So a head is not a component you could point at in isolation — it is a 64-column slice of three shared matrices, plus the comparison that slice performs.</text></svg>
