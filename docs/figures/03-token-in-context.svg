<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 400' width='880' height='400' role='img' aria-label='The layers rewrite each token'><title>The layers rewrite each token</title><rect width='880' height='400' fill='#fbfbfd'/><text x='24' y='30' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' fill='#1f2933' text-anchor='start' font-weight='600' font-style='normal'>3 · The stored numbers are only a starting point</text><text x='24' y='56' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>Following one token — “muscle”, row 3760 — through the twelve layers, in two different sentences.</text><rect x='24' y='92' width='210' height='78' rx='5' fill='#ffffff' stroke='#d8dee9' stroke-width='1'/><text x='36' y='114' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>row 3760 of the table</text><text x='36' y='136' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#1f2933' text-anchor='start' font-weight='normal' font-style='normal'>-0.09  -0.05  -0.09  …</text><text x='36' y='158' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='italic'>the same every time</text><text x='24' y='186' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>context-free: identical in</text><text x='24' y='202' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>every sentence ever written</text><line x1='240' y1='131' x2='285.0' y2='131.0' stroke='#6b7280' stroke-width='2'/><polygon points='292,131 285.60837741781387,133.85432317141698 285.60837741781387,128.14567682858302' fill='#6b7280'/><rect x='296' y='86' width='150' height='92' rx='5' fill='#e8eefb' stroke='#c3d3f2' stroke-width='1'/><text x='371' y='112' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f6feb' text-anchor='middle' font-weight='600' font-style='normal'>12 layers</text><text x='371' y='132' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>each token looks at every</text><text x='371' y='146' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>other — mixing in a share</text><text x='371' y='160' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>of each, by how well it fits</text><text x='371' y='200' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>the sentence enters here</text><line x1='452' y1='131' x2='497.0' y2='131.0' stroke='#6b7280' stroke-width='2'/><polygon points='504,131 497.60837741781387,133.85432317141698 497.60837741781387,128.14567682858302' fill='#6b7280'/><rect x='510' y='92' width='346' height='60' rx='5' fill='#ffffff' stroke='#d8dee9' stroke-width='1'/><text x='524' y='114' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1a7f37' text-anchor='start' font-weight='normal' font-style='normal'>“arterial smooth muscle …”</text><text x='524' y='136' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#1f2933' text-anchor='start' font-weight='normal' font-style='normal'>+0.08  -0.03  +0.21  …</text><rect x='510' y='168' width='346' height='60' rx='5' fill='#ffffff' stroke='#d8dee9' stroke-width='1'/><text x='524' y='190' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#bf8700' text-anchor='start' font-weight='normal' font-style='normal'>“he lost muscle mass …”</text><text x='524' y='212' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#1f2933' text-anchor='start' font-weight='normal' font-style='normal'>-0.17  -0.08  +0.09  …</text><rect x='24' y='236' width='832' height='96' rx='5' fill='#fff6e5' stroke='#f0d9a8' stroke-width='1'/><text x='40' y='260' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2933' text-anchor='start' font-weight='600' font-style='normal'>Measured on this exact token</text><text x='40' y='282' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>stored row  vs  the artery sentence</text><text x='330' y='282' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11.5' fill='#1f2933' text-anchor='end' font-weight='normal' font-style='normal'>0.135</text><text x='40' y='300' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>stored row  vs  the illness sentence</text><text x='330' y='300' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11.5' fill='#1f2933' text-anchor='end' font-weight='normal' font-style='normal'>0.140</text><text x='40' y='318' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>the two sentences, against each other</text><text x='330' y='318' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11.5' fill='#1f2933' text-anchor='end' font-weight='normal' font-style='normal'>0.939</text><text x='360' y='288' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1f2933' text-anchor='start' font-weight='normal' font-style='normal'>The stored row barely resembles what comes out —</text><text x='360' y='306' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1f2933' text-anchor='start' font-weight='normal' font-style='normal'>the layers do not adjust it, they replace it.</text><text x='24' y='362' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>So “muscle” in an artery paper and “muscle” in a wasting study are different numbers, which is what lets one vector stand for a meaning</text><text x='24' y='380' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>rather than a spelling.</text></svg>
