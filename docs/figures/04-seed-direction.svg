<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 404' width='880' height='404' role='img' aria-label='Seeds define a direction'><title>Seeds define a direction</title><rect width='880' height='404' fill='#fbfbfd'/><text x='24' y='30' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' fill='#1f2933' text-anchor='start' font-weight='600' font-style='normal'>4 · The seeds define the direction to score against</text><text x='24' y='58' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>Average the seed arrows. How long that average comes out says whether the seeds agree.</text><circle cx='210' cy='168' r='108' fill='none' stroke='#d8dee9' stroke-width='1.5' stroke-dasharray='4 4'/><line x1='210' y1='168' x2='241.21071643186968' y2='71.9432918541895' stroke='#6b7280' stroke-width='1.6'/><polygon points='243.37383539249433,65.28589624012342 244.1133380447565,72.24672491401687 238.68409274117974,70.48265617920478' fill='#6b7280'/><line x1='210' y1='168' x2='220.557374790033' y2='67.5532885678044' stroke='#6b7280' stroke-width='1.6'/><polygon points='221.28907403290657,60.591635300226486 223.45965443703503,67.24660191991839 217.78228065617262,66.64988589036345' fill='#6b7280'/><line x1='210' y1='168' x2='199.442625209967' y2='67.5532885678044' stroke='#6b7280' stroke-width='1.6'/><polygon points='198.71092596709343,60.591635300226486 202.21771934382738,66.64988589036345 196.54034556296497,67.24660191991839' fill='#6b7280'/><line x1='210' y1='168' x2='178.78928356813034' y2='71.94329185418948' stroke='#6b7280' stroke-width='1.6'/><polygon points='176.6261646075057,65.2858962401234 181.3159072588203,70.48265617920477 175.88666195524354,72.24672491401685' fill='#6b7280'/><line x1='210' y1='168' x2='210.0' y2='69.93876577017495' stroke='#1f6feb' stroke-width='3.4'/><polygon points='210.0,62.93876577017495 212.85432317141698,69.33038835236111 207.14567682858302,69.33038835236111' fill='#1f6feb'/><text x='210' y='310' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#1f2933' text-anchor='middle' font-weight='600' font-style='normal'>seeds that agree</text><text x='210' y='328' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>one subject, arrows nearly parallel</text><text x='210' y='348' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f6feb' text-anchor='middle' font-weight='normal' font-style='normal'>length of average = 0.97</text><circle cx='650' cy='168' r='108' fill='none' stroke='#d8dee9' stroke-width='1.5' stroke-dasharray='4 4'/><line x1='650' y1='168' x2='744.9089546993767' y2='133.45596552410746' stroke='#6b7280' stroke-width='1.6'/><polygon points='751.4868030448781,131.06182452082777 746.456878489735,135.93007461398943 744.5044064493634,130.56570177095188' fill='#6b7280'/><line x1='650' y1='168' x2='684.5440344758927' y2='73.09104530062325' stroke='#6b7280' stroke-width='1.6'/><polygon points='686.9381754791723,66.5131969551219 687.4342982290482,73.49559355063663 682.0699253860106,71.54312151026498' fill='#6b7280'/><line x1='650' y1='168' x2='615.4559655241075' y2='73.09104530062325' stroke='#6b7280' stroke-width='1.6'/><polygon points='613.0618245208278,66.51319695512188 617.9300746139895,71.54312151026498 612.5657017709519,73.49559355063661' fill='#6b7280'/><line x1='650' y1='168' x2='555.0910453006233' y2='133.45596552410746' stroke='#6b7280' stroke-width='1.6'/><polygon points='548.5131969551219,131.06182452082777 555.4955935506366,130.56570177095188 553.543121510265,135.93007461398943' fill='#6b7280'/><line x1='650' y1='168' x2='650.0' y2='105.78751073797484' stroke='#bf8700' stroke-width='3.4'/><polygon points='650.0,98.78751073797484 652.854323171417,105.179133320161 647.145676828583,105.179133320161' fill='#bf8700'/><text x='650' y='310' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#1f2933' text-anchor='middle' font-weight='600' font-style='normal'>seeds that don't</text><text x='650' y='328' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>two subjects, arrows pulling apart</text><text x='650' y='348' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#bf8700' text-anchor='middle' font-weight='normal' font-style='normal'>length of average = 0.64</text><line x1='440' y1='84' x2='440' y2='330' stroke='#d8dee9' stroke-width='1'/><text x='24' y='384' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>A short average points into the gap between subjects — a direction no seed occupies, so the gate scores against something none of your papers are about.</text></svg>
