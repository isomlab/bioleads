<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 350' width='880' height='350' role='img' aria-label='The direction every paper shares'><title>The direction every paper shares</title><rect width='880' height='350' fill='#fbfbfd'/><text x='24' y='30' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' fill='#1f2933' text-anchor='start' font-weight='600' font-style='normal'>5 · Why every score comes out near 0.99</text><text x='24' y='56' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>Of the 768 numbers, one is almost the same for every text — whatever the text is about.</text><text x='470' y='84' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>value at dimension 424</text><line x1='470' y1='92' x2='800' y2='92' stroke='#d8dee9' stroke-width='1'/><text x='456' y='118' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1f2933' text-anchor='end' font-weight='normal' font-style='normal'>TRPV1 mediates vasodilation in arterial smooth muscle.</text><rect x='470' y='104' width='319.11' height='20' rx='3' fill='#f6dde0' stroke='#e8b4ba' stroke-width='1'/><text x='781.11' y='118' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#cf222e' text-anchor='end' font-weight='normal' font-style='normal'>-0.967</text><text x='456' y='152' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1f2933' text-anchor='end' font-weight='normal' font-style='normal'>Wheat yield responses to nitrogen fertiliser in soils.</text><rect x='470' y='138' width='318.45' height='20' rx='3' fill='#f6dde0' stroke='#e8b4ba' stroke-width='1'/><text x='780.45' y='152' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#cf222e' text-anchor='end' font-weight='normal' font-style='normal'>-0.965</text><text x='456' y='186' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1f2933' text-anchor='end' font-weight='normal' font-style='normal'>Microglia mediate forgetting via synaptic elimination.</text><rect x='470' y='172' width='321.09' height='20' rx='3' fill='#f6dde0' stroke='#e8b4ba' stroke-width='1'/><text x='783.0899999999999' y='186' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#cf222e' text-anchor='end' font-weight='normal' font-style='normal'>-0.973</text><text x='456' y='220' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1f2933' text-anchor='end' font-weight='normal' font-style='normal'>The cat sat on the mat.</text><rect x='470' y='206' width='314.82' height='20' rx='3' fill='#f6dde0' stroke='#e8b4ba' stroke-width='1'/><text x='776.8199999999999' y='220' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#cf222e' text-anchor='end' font-weight='normal' font-style='normal'>-0.954</text><line x1='470' y1='246' x2='800' y2='246' stroke='#d8dee9' stroke-width='1'/><text x='470' y='264' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>−1.0</text><rect x='24' y='282' width='832' height='48' rx='5' fill='#fff6e5' stroke='#f0d9a8' stroke-width='1'/><text x='40' y='303' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2933' text-anchor='start' font-weight='600' font-style='normal'>That single shared dimension is 93% of each vector.</text><text x='40' y='321' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>Two papers are ~93% identical before either says anything — hence wheat scoring 0.957 against TRPV1.</text></svg>
