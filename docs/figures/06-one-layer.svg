<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 470' width='880' height='470' role='img' aria-label='What rewritten actually means'><title>What rewritten actually means</title><rect width='880' height='470' fill='#fbfbfd'/><text x='24' y='30' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' fill='#1f2933' text-anchor='start' font-weight='600' font-style='normal'>6 · What “rewritten” actually means</text><text x='24' y='56' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>One layer, one token. Nothing is replaced: each half works out a correction and adds it to what came in.</text><text x='28' y='96' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1f2933' text-anchor='start' font-weight='600' font-style='normal'>the token</text><rect x='28.0' y='106' width='6' height='18' rx='1' fill='#1a7f37' opacity='0.75'/><rect x='35.5' y='106' width='6' height='18' rx='1' fill='#1a7f37' opacity='0.75'/><rect x='43.0' y='106' width='6' height='18' rx='1' fill='#1a7f37' opacity='0.75'/><rect x='50.5' y='106' width='6' height='18' rx='1' fill='#1a7f37' opacity='0.75'/><rect x='58.0' y='106' width='6' height='18' rx='1' fill='#1a7f37' opacity='0.75'/><rect x='65.5' y='106' width='6' height='18' rx='1' fill='#1a7f37' opacity='0.75'/><rect x='73.0' y='106' width='6' height='18' rx='1' fill='#1a7f37' opacity='0.75'/><rect x='80.5' y='106' width='6' height='18' rx='1' fill='#1a7f37' opacity='0.75'/><rect x='88.0' y='106' width='6' height='18' rx='1' fill='#1a7f37' opacity='0.75'/><rect x='95.5' y='106' width='6' height='18' rx='1' fill='#1a7f37' opacity='0.75'/><text x='28' y='142' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>length 15.9</text><rect x='140' y='80' width='190' height='120' rx='5' fill='#e8eefb' stroke='#c3d3f2' stroke-width='1'/><text x='235' y='100' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1f6feb' text-anchor='middle' font-weight='600' font-style='normal'>ATTENTION</text><text x='235' y='118' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>the twelve heads</text><text x='235' y='134' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' fill='#1f2933' text-anchor='middle' font-weight='normal' font-style='normal'>looks at the other tokens</text><text x='235' y='150' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>— i.e. mixes them in, by</text><text x='235' y='164' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>how well each one matches</text><text x='235' y='184' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='10' fill='#1f6feb' text-anchor='middle' font-weight='normal' font-style='normal'>→ a correction, 29% as big</text><text x='352' y='126' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='20' fill='#1f2933' text-anchor='middle' font-weight='normal' font-style='normal'>⊕</text><text x='352' y='146' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='10' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>add</text><text x='352' y='160' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='10' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>+ rescale</text><rect x='384' y='80' width='210' height='120' rx='5' fill='#eef7f1' stroke='#b7dfc6' stroke-width='1'/><text x='489' y='100' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1a7f37' text-anchor='middle' font-weight='600' font-style='normal'>FEED-FORWARD</text><text x='489' y='118' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>768 → 3072 → 768</text><text x='489' y='134' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' fill='#1f2933' text-anchor='middle' font-weight='normal' font-style='normal'>this token only —</text><text x='489' y='150' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' fill='#1f2933' text-anchor='middle' font-weight='normal' font-style='normal'>no other token is read</text><text x='489' y='184' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='10' fill='#1a7f37' text-anchor='middle' font-weight='normal' font-style='normal'>→ a correction, 23% of it</text><text x='616' y='126' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='20' fill='#1f2933' text-anchor='middle' font-weight='normal' font-style='normal'>⊕</text><text x='616' y='146' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='10' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>add</text><text x='616' y='160' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='10' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>+ rescale</text><text x='652' y='96' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1f2933' text-anchor='start' font-weight='600' font-style='normal'>the same token,</text><text x='652' y='112' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1f2933' text-anchor='start' font-weight='600' font-style='normal'>nudged</text><rect x='652.0' y='122' width='6' height='18' rx='1' fill='#1a7f37' opacity='0.95'/><rect x='659.5' y='122' width='6' height='18' rx='1' fill='#1a7f37' opacity='0.95'/><rect x='667.0' y='122' width='6' height='18' rx='1' fill='#1a7f37' opacity='0.95'/><rect x='674.5' y='122' width='6' height='18' rx='1' fill='#1a7f37' opacity='0.95'/><rect x='682.0' y='122' width='6' height='18' rx='1' fill='#1a7f37' opacity='0.95'/><rect x='689.5' y='122' width='6' height='18' rx='1' fill='#1a7f37' opacity='0.95'/><rect x='697.0' y='122' width='6' height='18' rx='1' fill='#1a7f37' opacity='0.95'/><rect x='704.5' y='122' width='6' height='18' rx='1' fill='#1a7f37' opacity='0.95'/><rect x='712.0' y='122' width='6' height='18' rx='1' fill='#1a7f37' opacity='0.95'/><rect x='719.5' y='122' width='6' height='18' rx='1' fill='#1a7f37' opacity='0.95'/><text x='652' y='158' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>cosine 0.941 to what came in</text><line x1='116' y1='126' x2='131.0' y2='126.0' stroke='#6b7280' stroke-width='1.6'/><polygon points='138,126 131.60837741781384,128.85432317141698 131.60837741781384,123.145676828583' fill='#6b7280'/><line x1='332' y1='126' x2='339.0' y2='126.0' stroke='#6b7280' stroke-width='1.6'/><polygon points='346,126 339.60837741781387,128.85432317141698 339.60837741781387,123.145676828583' fill='#6b7280'/><line x1='360' y1='126' x2='375.0' y2='126.0' stroke='#6b7280' stroke-width='1.6'/><polygon points='382,126 375.60837741781387,128.85432317141698 375.60837741781387,123.145676828583' fill='#6b7280'/><line x1='598' y1='126' x2='605.0' y2='126.0' stroke='#6b7280' stroke-width='1.6'/><polygon points='612,126 605.6083774178138,128.85432317141698 605.6083774178138,123.145676828583' fill='#6b7280'/><line x1='626' y1='126' x2='641.0' y2='126.0' stroke='#6b7280' stroke-width='1.6'/><polygon points='648,126 641.6083774178138,128.85432317141698 641.6083774178138,123.145676828583' fill='#6b7280'/><rect x='24' y='228' width='832' height='92' rx='5' fill='#fff6e5' stroke='#f0d9a8' stroke-width='1'/><text x='40' y='252' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2933' text-anchor='start' font-weight='600' font-style='normal'>“Rewritten” means added to, not replaced.</text><text x='40' y='274' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>Each half computes a correction and adds it to the vector already there — which is why one layer only moves it from</text><text x='40' y='292' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>1.00 to 0.94, and why twelve of them can move it a long way without ever discarding what was there.</text><text x='40' y='310' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>Twelve layers means twenty-four of these corrections in sequence.</text><line x1='24' y1='344' x2='856' y2='344' stroke='#d8dee9' stroke-width='1'/><text x='24' y='366' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2933' text-anchor='start' font-weight='normal' font-style='normal'>The two halves do different jobs. Attention is the only place one token's numbers can reach another; the feed-forward takes one token in</text><text x='24' y='384' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>isolation and is where most of the model’s parameters live — it is four times wider inside than the vector it transforms.</text><text x='24' y='414' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>Both halves end with a rescale (LayerNorm) that keeps the numbers in a workable range, which is why its length stays near 16 rather than</text><text x='24' y='432' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>growing at every step.</text></svg>
