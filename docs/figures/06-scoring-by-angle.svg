<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 400' width='880' height='400' role='img' aria-label='Candidates are scored by angle'><title>Candidates are scored by angle</title><rect width='880' height='400' fill='#fbfbfd'/><text x='24' y='30' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' fill='#1f2933' text-anchor='start' font-weight='600' font-style='normal'>6 · Candidates are scored by the angle they make with the topic</text><text x='24' y='56' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>Real PubMedBERT cosines — and note how little of the circle any of this text actually uses.</text><path d='M 236 236 L 388 236 A 152 152 0 0 0 381.51256362487425 192.0671668644403 Z' fill='#e3ecfa' stroke='none'/><circle cx='236' cy='236' r='152' fill='none' stroke='#d8dee9' stroke-width='1.5'/><line x1='64' y1='236' x2='412' y2='236' stroke='#d8dee9' stroke-width='1' stroke-dasharray='3 3'/><line x1='236' y1='236' x2='381.0' y2='236.0' stroke='#1f6feb' stroke-width='3.4'/><polygon points='388.0,236.0 381.60837741781387,238.85432317141698 381.60837741781387,233.14567682858302' fill='#1f6feb'/><line x1='236' y1='236' x2='379.65843686835933' y2='216.32124199702588' stroke='#1a7f37' stroke-width='2.4'/><polygon points='386.59367175165943,215.37123298998574 380.64856158437135,219.06659022560015 379.8738093781286,213.41076118942217' fill='#1a7f37'/><line x1='236' y1='236' x2='374.81132714214976' y2='194.0903894430516' stroke='#cf222e' stroke-width='2.4'/><polygon points='381.51256362487425,192.0671668644403 376.21872886137606,196.64704824901548 374.56874855078627,191.18204980050538' fill='#cf222e'/><path d='M 288 236 A 52 52 0 0 0 285.78061387166747 220.97034655888748' fill='none' stroke='#6b7280' stroke-width='1.2'/><text x='300' y='230' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='italic'>θ</text><text x='236' y='428' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>every direction these texts use</text><rect x='462' y='96' width='394' height='150' rx='5' fill='#ffffff' stroke='#d8dee9' stroke-width='1'/><text x='480' y='122' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>angle from the topic</text><text x='838' y='122' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>cosine</text><line x1='480' y1='132' x2='838' y2='132' stroke='#d8dee9' stroke-width='1'/><rect x='480' y='149' width='11' height='11' rx='2' fill='#1f6feb'/><text x='500' y='158' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2933' text-anchor='start' font-weight='normal' font-style='normal'>q₀   the seed topic</text><text x='712' y='158' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='12' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>0°</text><text x='838' y='158' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='12' fill='#1f6feb' text-anchor='end' font-weight='normal' font-style='normal'>1.0000</text><rect x='480' y='179' width='11' height='11' rx='2' fill='#1a7f37'/><text x='500' y='188' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2933' text-anchor='start' font-weight='normal' font-style='normal'>a related TRPV1 paper</text><text x='712' y='188' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='12' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>7.8°</text><text x='838' y='188' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='12' fill='#1a7f37' text-anchor='end' font-weight='normal' font-style='normal'>0.9907</text><rect x='480' y='209' width='11' height='11' rx='2' fill='#cf222e'/><text x='500' y='218' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2933' text-anchor='start' font-weight='normal' font-style='normal'>wheat fertiliser in soils</text><text x='712' y='218' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='12' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>16.8°</text><text x='838' y='218' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='12' fill='#cf222e' text-anchor='end' font-weight='normal' font-style='normal'>0.9574</text><rect x='462' y='262' width='394' height='76' rx='5' fill='#fff6e5' stroke='#f0d9a8' stroke-width='1'/><text x='480' y='286' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12.5' fill='#1f2933' text-anchor='start' font-weight='600' font-style='normal'>A paper about wheat still scores 0.957.</text><text x='480' y='306' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>Everything crowds into a narrow wedge, so the</text><text x='480' y='324' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>ranking is meaningful — the number is not.</text><text x='24' y='378' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>That is why step 5 keeps the top K rather than everything above a fixed score.</text></svg>
