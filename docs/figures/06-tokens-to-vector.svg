<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 430' width='880' height='430' role='img' aria-label='A sentence becomes one vector'><title>A sentence becomes one vector</title><rect width='880' height='430' fill='#fbfbfd'/><text x='24' y='30' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' fill='#1f2933' text-anchor='start' font-weight='600' font-style='normal'>6 · A sentence becomes one vector</text><text x='24' y='60' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='13' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='italic'>“TRPV1 mediates vasodilation in arterial smooth muscle.”</text><text x='24' y='90' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>① split into word pieces from a fixed 30,522-word vocabulary</text><rect x='24' y='100' width='45.5' height='24' rx='5' fill='#e4ecf7' stroke='#d8dee9' stroke-width='1'/><text x='46.75' y='116' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#1f2933' text-anchor='middle' font-weight='normal' font-style='normal'>[CLS]</text><text x='46.75' y='138' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10' fill='#1f6feb' text-anchor='middle' font-weight='normal' font-style='normal'>2</text><rect x='75.5' y='100' width='45.5' height='24' rx='5' fill='#eef2f7' stroke='#d8dee9' stroke-width='1'/><text x='98.25' y='116' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#1f2933' text-anchor='middle' font-weight='normal' font-style='normal'>trpv1</text><text x='98.25' y='138' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10' fill='#1f6feb' text-anchor='middle' font-weight='normal' font-style='normal'>17501</text><rect x='127.0' y='100' width='67.4' height='24' r