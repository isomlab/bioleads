ll='#eef2f7' stroke='#d8dee9' stroke-width='1'/><text x='432.4' y='116' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#1f2933' text-anchor='middle' font-weight='normal' font-style='normal'>smooth</text><text x='432.4' y='138' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10' fill='#1f6feb' text-anchor='middle' font-weight='normal' font-style='normal'>6689</text><rect x='464.8' y='100' width='52.8' height='24' rx='5' fill='#eef2f7' stroke='#d8dee9' stroke-width='1'/><text x='491.2' y='116' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#1f2933' text-anchor='middle' font-weight='normal' font-style='normal'>muscle</text><text x='491.2' y='138' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10' fill='#1f6feb' text-anchor='middle' font-weight='normal' font-style='normal'>3760</text><rect x='523.6' y='100' width='16.3' height='24' rx='5' fill='#eef2f7' stroke='#d8dee9' stroke-width='1'/><text x='531.75' y='116' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#1f2933' text-anchor='middle' font-weight='normal' font-style='normal'>.</text><text x='531.75' y='138' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10' fill='#1f6feb' text-anchor='middle' font-weight='normal' font-style='normal'>18</text><rect x='545.9' y='100' width='45.5' height='24' rx='5' fill='#e4ecf7' stroke='#d8dee9' stroke-width='1'/><text x='568.65' y='116' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#1f2933' text-anchor='middle' font-weight='normal' font-style='normal'>[SEP]</text><text x='568.65' y='138' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10' fill='#1f6feb' text-anchor='middle' font-weight='normal' font-style='normal'>3</text><text x='24' y='156' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>② each word piece is just its row number in that vocabulary</text><text x='24' y='182' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>③ that row number looks up 768 numbers, which the model then rewrites using the surrounding words</text><text x='150' y='208' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#1f2933' text-anchor='end' font-weight='normal' font-style='normal'>[CLS]</text><rect x='162' y='194' width='300' height='20' rx='5' fill='#ffffff' stroke='#d8dee9' stroke-width='1'/><text x='172' y='208' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>-0.05  -0.48  +0.03  -0.34  -0.24</text><text x='470' y='208' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>…</text><text x='150' y='232' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#1f2933' text-anchor='end' font-weight='normal' font-style='normal'>trpv1</text><rect x='162' y='218' width='300' height='20' rx='5' fill='#ffffff' stroke='#d8dee9' stroke-width='1'/><text x='172' y='232' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>-0.02  -0.33  -0.18  -0.20  -0.23</text><text x='470' y='232' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>…</text><text x='150' y='256' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#1f2933' text-anchor='end' font-weight='normal' font-style='normal'>mediates</text><rect x='162' y='242' width='300' height='20' rx='5' fill='#ffffff' stroke='#d8dee9' stroke-width='1'/><text x='172' y='256' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>-0.01  +0.00  +0.10  -0.22  +0.10</text><text x='470' y='256' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>…</text><text x='150' y='280' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#1f2933' text-anchor='end' font-weight='normal' font-style='normal'>vasodilation</text><rect x='162' y='266' width='300' height='20' rx='5' fill='#ffffff' stroke='#d8dee9' stroke-width='1'/><text x='172' y='280' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>-0.09  -0.10  -0.09  -0.12  -0.17</text><text x='470' y='280' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>…</text><text x='150' y='304' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#1f2933' text-anchor='end' font-weight='normal' font-style='normal'>…</text><rect x='162' y='290' width='300' height='20' rx='5' fill='#ffffff' stroke='#d8dee9' stroke-width='1'/><text x='172' y='304' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>…</text><text x='470' y='304' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'></text><text x='150' y='328' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#1f2933' text-anchor='end' font-weight='normal' font-style='normal'>[SEP]</text><rect x='162' y='314' width='300' height='20' rx='5' fill='#ffffff' stroke='#d8dee9' stroke-width='1'/><text x='172' y='328' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>-0.07  -0.21  -0.05  -0.19  -0.11</text><text x='470' y='328' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>…</text><path d='M486 196 q10 0 10 12 v36 q0 12 10 12 q-10 0 -10 12 v36 q0 12 -10 12' fill='none' stroke='#d8dee9' stroke-width='1.5'/><text x='506' y='272' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2933' text-anchor='start' font-weight='600' font-style='normal'>④ average</text><text x='506' y='288' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='10.5' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>over the real tokens</text><line x1='592' y1='267' x2='619.0' y2='267.0' stroke='#6b7280' stroke-width='1.8'/><polygon points='626,267 619.6083774178138,269.854323171417 619.6083774178138,264.145676828583' fill='#6b7280'/><text x='636' y='214' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>one vector for the whole sentence</text><rect x='636' y='224' width='216' height='22' rx='5' fill='#ffffff' stroke='#d8dee9' stroke-width='1'/><text x='646' y='239' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#1f2933' text-anchor='start' font-weight='normal' font-style='normal'>-0.02  -0.10  -0.01  -0.16  …</text><text x='636' y='268' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>length 14.08</text><line x1='700' y1='276' x2='700.0' y2='293.0' stroke='#6b7280' stroke-width='1.8'/><polygon points='700,300 697.145676828583,293.60837741781387 702.854323171417,293.6083774178138' fill='#6b7280'/><text x='712' y='294' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#1f2933' text-anchor='start' font-weight='normal' font-style='normal'>⑤ scale to length 1</text><rect x='636' y='308' width='216' height='22' rx='5' fill='#e7f3ec' stroke='#b7dfc6' stroke-width='1'/><text x='646' y='323' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#1a7f37' text-anchor='start' font-weight='normal' font-style='normal'>-0.0011  -0.0069  -0.0010  …</text><text x='636' y='350' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#1a7f37' text-anchor='start' font-weight='normal' font-style='normal'>length 1.00 — only the direction is kept</text><line x1='24' y1='372' x2='856' y2='372' stroke='#d8dee9' stroke-width='1'/><text x='24' y='396' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2933' text-anchor='start' font-weight='normal' font-style='normal'>768 is simply how wide this model is built — every token vector, at every layer, is 768 numbers.</text><text x='24' y='416' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>Papers about similar things end up pointing in similar directions, and that is the whole basis of the relevance gate.</text></svg>
