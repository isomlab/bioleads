<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 880 420' width='880' height='420' role='img' aria-label='What top-K trades'><title>What top-K trades</title><rect width='880' height='420' fill='#fbfbfd'/><text x='24' y='30' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='15' fill='#1f2933' text-anchor='start' font-weight='600' font-style='normal'>10 · What K trades</text><text x='24' y='56' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>Benchmarked on 12 systematic reviews. Precision falls and recall rises as K grows.</text><line x1='78' y1='320.0' x2='560' y2='320.0' stroke='#d8dee9' stroke-width='1'/><text x='68' y='324.0' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>0.0</text><line x1='78' y1='250.58823529411765' x2='560' y2='250.58823529411765' stroke='#d8dee9' stroke-width='1'/><text x='68' y='254.58823529411765' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>0.1</text><line x1='78' y1='181.1764705882353' x2='560' y2='181.1764705882353' stroke='#d8dee9' stroke-width='1'/><text x='68' y='185.1764705882353' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>0.2</text><line x1='78' y1='111.76470588235296' x2='560' y2='111.76470588235296' stroke='#d8dee9' stroke-width='1'/><text x='68' y='115.76470588235296' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='end' font-weight='normal' font-style='normal'>0.3</text><text x='78.0' y='340' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>10</text><text x='158.33333333333331' y='340' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>25</text><text x='238.66666666666666' y='340' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>50</text><text x='319.0' y='340' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>100</text><text x='399.3333333333333' y='340' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>200</text><text x='479.6666666666667' y='340' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>400</text><text x='560.0' y='340' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' font-size='10.5' fill='#6b7280' text-anchor='middle' font-weight='normal' font-style='normal'>800</text><text x='319.0' y='362' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11.5' fill='#1f2933' text-anchor='middle' font-weight='normal' font-style='normal'>K  (papers kept per direction)</text><line x1='78' y1='94.27294117647062' x2='560' y2='94.27294117647062' stroke='#6b7280' stroke-width='1.4' stroke-dasharray='5 4'/><text x='568' y='98.27294117647062' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>bfs recall</text><line x1='78' y1='303.0635294117647' x2='560' y2='303.0635294117647' stroke='#6b7280' stroke-width='1.4' stroke-dasharray='5 4'/><text x='568' y='307.0635294117647' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>bfs precision</text><polyline points='78.0,296.88588235294117 158.33333333333331,257.3211764705882 238.66666666666666,222.4070588235294 319.0,148.34470588235294 399.3333333333333,112.32 479.6666666666667,98.85411764705884 560.0,94.27294117647062' fill='none' stroke='#1a7f37' stroke-width='2.6'/><circle cx='78.0' cy='296.88588235294117' r='3.6' fill='#1a7f37'/><circle cx='158.33333333333331' cy='257.3211764705882' r='3.6' fill='#1a7f37'/><circle cx='238.66666666666666' cy='222.4070588235294' r='3.6' fill='#1a7f37'/><circle cx='319.0' cy='148.34470588235294' r='3.6' fill='#1a7f37'/><circle cx='399.3333333333333' cy='112.32' r='3.6' fill='#1a7f37'/><circle cx='479.6666666666667' cy='98.85411764705884' r='3.6' fill='#1a7f37'/><circle cx='560.0' cy='94.27294117647062' r='3.6' fill='#1a7f37'/><text x='568.0' y='84.27294117647062' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1a7f37' text-anchor='start' font-weight='600' font-style='normal'>recall</text><polyline points='78.0,232.88823529411766 158.33333333333331,254.6835294117647 238.66666666666666,260.7223529411765 319.0,276.6870588235294 399.3333333333333,284.5305882352941 479.6666666666667,293.27647058823527 560.0,297.2329411764706' fill='none' stroke='#1f6feb' stroke-width='2.6'/><circle cx='78.0' cy='232.88823529411766' r='3.6' fill='#1f6feb'/><circle cx='158.33333333333331' cy='254.6835294117647' r='3.6' fill='#1f6feb'/><circle cx='238.66666666666666' cy='260.7223529411765' r='3.6' fill='#1f6feb'/><circle cx='319.0' cy='276.6870588235294' r='3.6' fill='#1f6feb'/><circle cx='399.3333333333333' cy='284.5305882352941' r='3.6' fill='#1f6feb'/><circle cx='479.6666666666667' cy='293.27647058823527' r='3.6' fill='#1f6feb'/><circle cx='560.0' cy='297.2329411764706' r='3.6' fill='#1f6feb'/><text x='568.0' y='287.2329411764706' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f6feb' text-anchor='start' font-weight='600' font-style='normal'>precision</text><line x1='238.66666666666666' y1='72' x2='238.66666666666666' y2='320' stroke='#1f6feb' stroke-width='1.2' stroke-dasharray='3 3'/><text x='238.66666666666666' y='66' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#1f6feb' text-anchor='middle' font-weight='normal' font-style='normal'>default K = 50</text><rect x='319.0' y='84' width='80.33333333333331' height='236' fill='#1a7f37' opacity='0.07'/><text x='359.16666666666663' y='66' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='11' fill='#1a7f37' text-anchor='middle' font-weight='normal' font-style='normal'>K ≈ 100–200</text><rect x='616' y='84' width='240' height='196' rx='5' fill='#ffffff' stroke='#d8dee9' stroke-width='1'/><text x='632' y='110' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2933' text-anchor='start' font-weight='600' font-style='normal'>Reading it</text><text x='632' y='132' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>K = 25 is sharpest.</text><text x='632' y='154' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>K = 50 is the default and has</text><text x='632' y='176' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>the best record head-to-head.</text><text x='632' y='198' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1a7f37' text-anchor='start' font-weight='normal' font-style='normal'>K ≈ 100–200 keeps enough</text><text x='632' y='220' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1a7f37' text-anchor='start' font-weight='normal' font-style='normal'>intermediates for ABC discovery.</text><text x='632' y='242' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2933' text-anchor='start' font-weight='normal' font-style='normal'>At K = 800 recall equals bfs</text><text x='632' y='264' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#1f2933' text-anchor='start' font-weight='normal' font-style='normal'>exactly — on 87% less material.</text><text x='24' y='400' font-family='ui-sans-serif,-apple-system,Segoe UI,Helvetica,Arial,sans-serif' font-size='12' fill='#6b7280' text-anchor='start' font-weight='normal' font-style='normal'>The recall gap at small K is the cutoff choosing, not the gate failing — so there is no breadth argument for taking everything.</text></svg>
