[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioleads"
version = "0.1.0"
description = "Mine biomedical literature for enriched terms, co-occurrence networks, and Swanson-style hypothesis leads."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dan Isom" }]

# Core deps: kept light so the pipeline imports and runs on CPU without
# any model downloads. Heavier extras (NER models, transformers) are optional.
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "networkx>=3.1",
    "pandas>=2.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
pdf = ["pymupdf>=1.23"]
pubmed = ["biopython>=1.81", "requests>=2.31"]
ner = ["scispacy>=0.5.4", "spacy>=3.7"]
embed = ["transformers>=4.40", "torch>=2.2"]
viz = ["pyvis>=0.3.2", "plotly>=5.18", "umap-learn>=0.5"]
all = [
    "pymupdf>=1.23",
    "biopython>=1.81",
    "requests>=2.31",
    "scispacy>=0.5.4",
    "spacy>=3.7",
    "transformers>=4.40",
    "torch>=2.2",
    "pyvis>=0.3.2",
    "plotly>=5.18",
    "umap-learn>=0.5",
]
dev = ["pytest>=7.4"]

[project.scripts]
bioleads = "bioleads.cli:main"

[project.gui-scripts]
bioleads-gui = "bioleads.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
